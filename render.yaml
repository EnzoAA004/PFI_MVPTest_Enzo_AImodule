services:
  - type: web
    name: pfi-ai-module
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: PFI_MODEL_DIR
        value: /app/models/final
      - key: PFI_SAGITTAL_MODEL_PATH
        value: /app/models/final/sagittal_spider_multiclass_final_best.pt
      - key: PFI_AXIAL_MODEL_PATH
        value: /app/models/final/axial_t2_alkafri_final_v2_candidate.pt
      - key: PFI_MODEL_REGISTRY
        value: config/model_registry_final.json
      - key: PFI_DATA_FREEZE_CONFIG
        value: config/data_freeze_config.json
      - key: PFI_OUTPUT_DIR
        value: /app/outputs
      # Donde quedan las series subidas, ya de-identificadas (ver deidentify.py).
      #
      # **En Render esto NO persiste.** El plan free no admite disco, asi que el
      # directorio vive en la capa efimera del contenedor: cada deploy —y cada despertar
      # tras dormirse— se lleva los estudios subidos y sus inputIds dejan de resolver.
      # El registro se rehidrata desde uploads/inputs/registry.json, que se va con ellos.
      #
      # Se declara igual, y no se omite, porque el default relativo (`uploads/inputs`)
      # depende del working directory y hace que el problema aparezca como una ruta rara
      # en un log en vez de como una limitacion conocida del entorno.
      #
      # Para que persista hacen falta un plan con disco y un bloque `disk:` montado aca.
      # En local, docker-compose ya lo resuelve con el volumen `ai-uploads`.
      - key: PFI_UPLOAD_DIR
        value: /app/uploads/inputs
      # Clasificador subarticular (P10.6). Se deja declarada y vacia a proposito: el .pt no
      # esta en la imagen, asi que en Render ese endpoint responde 503 hasta que haya una
      # forma de publicar el artefacto. Declararla evita que "no configurado" pase por
      # olvido; el resto del servicio no depende de ella.
      - key: PFI_SUBARTICULAR_CHECKPOINT_PATH
        value: ""
      - key: PFI_ROOT
        value: /app
