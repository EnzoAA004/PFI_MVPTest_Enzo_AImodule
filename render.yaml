services:
  - type: web
    name: pfi-ai-module
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: PFI_MODEL_DIR
        value: /app/models/final
      - key: PFI_SAGITTAL_MODEL_PATH
        value: /app/models/final/sagittal_spider_multiclass_final_best.pt
      - key: PFI_AXIAL_MODEL_PATH
        value: /app/models/final/axial_t2_alkafri_final_v2_candidate.pt
      - key: PFI_MODEL_REGISTRY
        value: config/model_registry_final.json
      - key: PFI_DATA_FREEZE_CONFIG
        value: config/data_freeze_config.json
      - key: PFI_OUTPUT_DIR
        value: /app/outputs
      # Clasificador subarticular (P10.6). Se deja declarada y vacia a proposito: el .pt no
      # esta en la imagen, asi que en Render ese endpoint responde 503 hasta que haya una
      # forma de publicar el artefacto. Declararla evita que "no configurado" pase por
      # olvido; el resto del servicio no depende de ella.
      - key: PFI_SUBARTICULAR_CHECKPOINT_PATH
        value: ""
      - key: PFI_ROOT
        value: /app
