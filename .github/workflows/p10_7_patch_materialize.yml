name: P10.7 materialize notebook patch

on:
  push:
    branches:
      - enzo/p10-7-spider-degenerative-multitask
    paths:
      - .p10_7_materialize/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@v4
        with:
          ref: enzo/p10-7-spider-degenerative-multitask
          fetch-depth: 0

      - name: Materialize and validate notebooks
        shell: bash
        run: |
          set -euo pipefail
          NB66="notebooks/p10_7_spider_degenerative/66_P10_7_SPIDER_disc_level_dataset_and_crops.ipynb"
          NB67="notebooks/p10_7_spider_degenerative/67_P10_7_SPIDER_multitask_degenerative_training.ipynb"

          cat .p10_7_materialize/66.b64.part* | base64 -d > "$NB66"
          cat .p10_7_materialize/67.b64.part* | base64 -d > "$NB67"

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          expected = {
              Path("notebooks/p10_7_spider_degenerative/66_P10_7_SPIDER_disc_level_dataset_and_crops.ipynb"): "f10a87a42daeb3d7cbee15193a1edc1d78d2689c624eff56091c9675dd136fc6",
              Path("notebooks/p10_7_spider_degenerative/67_P10_7_SPIDER_multitask_degenerative_training.ipynb"): "9af95c55959d49f8c469dabdc9629a1a18116a751652ae1f5255c0223d9c6f94",
          }

          for path, expected_sha in expected.items():
              raw = path.read_bytes()
              actual_sha = hashlib.sha256(raw).hexdigest()
              if actual_sha != expected_sha:
                  raise RuntimeError(f"SHA mismatch for {path}: {actual_sha} != {expected_sha}")

              notebook = json.loads(raw)
              if notebook.get("nbformat") != 4:
                  raise RuntimeError(f"Unexpected nbformat for {path}")

              for index, cell in enumerate(notebook.get("cells", [])):
                  if cell.get("cell_type") != "code":
                      continue
                  source = cell.get("source", "")
                  if isinstance(source, list):
                      source = "".join(source)
                  if source.lstrip().startswith("!"):
                      continue
                  compile(source, f"{path}:cell{index}", "exec")

              print(path, actual_sha, "validated")
          PY

      - name: Commit clean notebook patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .p10_7_materialize
          git rm .github/workflows/p10_7_patch_materialize.yml
          git add \
            notebooks/p10_7_spider_degenerative/66_P10_7_SPIDER_disc_level_dataset_and_crops.ipynb \
            notebooks/p10_7_spider_degenerative/67_P10_7_SPIDER_multitask_degenerative_training.ipynb
          git commit -m "fix(p10.7): recover partial modalities and stabilize training"
          git push origin HEAD:enzo/p10-7-spider-degenerative-multitask
